name: Apply QRON UI update

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-ui:
    if: "!contains(github.event.head_commit.message, '[qron-ui]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply UI and security changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          s = s.replace('category === "all" ? "Популярное"', 'category === "all" ? "Меню"')
          s = s.replace("category === 'all' ? 'Популярное'", "category === 'all' ? 'Меню'")
          s = re.sub(r'(?s)\\.floating-cart\\s*\\{.*?\\}', '', s)

          css = r'''
          /* ===== QRON REFERENCE UI ===== */
          :root{--yellow:#ffd400;--black:#050505;--panel:#111214}
          body{background:#000!important;color:#fff!important}
          .page{max-width:430px!important;background:#000!important;padding:12px 14px 92px!important}
          .top-header{position:sticky!important;top:0!important;z-index:500!important;background:#050505!important;padding:8px 0 10px!important;margin:0 0 10px!important}
          .brand{color:var(--yellow)!important;font-style:italic!important;font-weight:900!important;font-size:30px!important;line-height:.9!important}
          .telegram-user{display:none!important}
          .hero{background:#050505!important;border:1px solid #292929!important;border-radius:24px!important;padding:0!important;overflow:hidden!important}
          .hero-title{color:var(--yellow)!important}
          .categories{display:flex!important;gap:10px!important;overflow-x:auto!important;scrollbar-width:none!important;padding-bottom:4px!important}
          .categories::-webkit-scrollbar{display:none}
          .category{flex:0 0 82px!important;min-height:82px!important;background:#111214!important;color:#fff!important;border:1px solid #252525!important;border-radius:18px!important;padding:10px!important;align-items:center!important;justify-content:center!important;gap:7px!important}
          .category.active,.category.selected{background:var(--yellow)!important;color:#000!important;border-color:var(--yellow)!important}
          .category-icon{font-size:28px!important;color:var(--yellow)!important}
          .category-name{font-size:12px!important;text-align:center!important}
          .product,.home-product{background:#111214!important;border:1px solid #303030!important;border-radius:18px!important;overflow:hidden!important}
          .products,.home-products{grid-template-columns:1fr 1fr!important;gap:12px!important}
          .product-image-wrap,.home-product-image-wrap{height:145px!important;min-height:145px!important;max-height:145px!important;overflow:hidden!important}
          .product-image,.home-product-image{width:100%!important;height:145px!important;min-height:145px!important;max-height:145px!important;object-fit:cover!important;display:block!important}
          .product-content,.home-product-content{padding:11px!important}
          .product-name,.home-product-name{font-size:15px!important;color:#fff!important}
          .product-price,.home-product-price{font-size:18px!important;color:#fff!important;font-weight:900!important}
          .add-button,.home-add-button{background:var(--yellow)!important;color:#000!important;border-radius:50%!important;font-weight:900!important}
          .main-button{background:var(--yellow)!important;color:#000!important}
          .floating-cart{display:none!important}
          .bottom-nav{position:fixed!important;left:0!important;right:0!important;bottom:0!important;z-index:600!important;background:#050505!important;border-top:1px solid #252525!important}
          .bottom-nav .active,.bottom-nav .nav-item.active{color:var(--yellow)!important}
          .bottom-nav svg{stroke:currentColor!important}
          .search,.search-bar{background:#171719!important;border:1px solid #303030!important;color:#fff!important;border-radius:18px!important}
          input,textarea{background:#111214!important;color:#fff!important;border-color:#303030!important}
          '''
          if '/* ===== QRON REFERENCE UI ===== */' not in s:
              s = s.replace('</style>', css + '\n</style>', 1)

          # History: keep the UI user check, but authenticate the API request with signed Telegram initData.
          s = s.replace('''      const user =\n        tg.initDataUnsafe &&\n        tg.initDataUnsafe.user;''', '''      const user =\n        tg.initDataUnsafe &&\n        tg.initDataUnsafe.user;\n\n      const initData = tg.initData;''', 1)
          s = s.replace('''          `/api/history?telegram_id=${encodeURIComponent(user.id)}`\n        );''', '''          `/api/history`,\n          {\n            headers: {\n              "X-Telegram-Init-Data": initData\n            }\n          }\n        );''', 1)

          # Order: send signed initData; identity and prices are derived server-side.
          s = s.replace('''      const user =\n        tg.initDataUnsafe &&\n        tg.initDataUnsafe.user;''', '''      const user =\n        tg.initDataUnsafe &&\n        tg.initDataUnsafe.user;\n\n      const initData = tg.initData;''', 1)
          s = s.replace('''              headers: {\n                "Content-Type":\n                  "application/json"\n              },''', '''              headers: {\n                "Content-Type":\n                  "application/json",\n                "X-Telegram-Init-Data":\n                  initData\n              },''', 1)
          s = s.replace('''                  total,\n\n                  user: {\n\n                    id:\n                      user.id,\n\n                    first_name:\n                      user.first_name ||\n                      "",\n\n                    username:\n                      user.username ||\n                      ""\n\n                  },\n\n                  customer:''', '''                  customer:''', 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit UI/security update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Apply Telegram auth client integration [qron-security]'
          git push
