<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QRON</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      padding-bottom: 90px;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #111;
    }

    .header {
      margin-bottom: 25px;
    }

    .logo {
      font-size: 32px;
      font-weight: 800;
    }

    .subtitle {
      color: #777;
      margin-top: 5px;
    }

    .category,
    .product,
    .cart,
    .checkout-box {
      background: white;
      padding: 18px;
      border-radius: 18px;
      margin-bottom: 12px;
    }

    .category {
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
    }

    .category:active,
    .product:active,
    button:active {
      transform: scale(0.98);
    }

    .product {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .product-name {
      font-size: 17px;
      font-weight: 600;
    }

    .price {
      color: #777;
      margin-top: 6px;
    }

    button {
      border: 0;
      background: #111;
      color: white;
      padding: 11px 16px;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .back {
      display: inline-block;
      background: white;
      padding: 12px 16px;
      border-radius: 12px;
      margin-bottom: 20px;
      font-weight: 600;
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    .cart-button {
      position: fixed;
      left: 20px;
      right: 20px;
      bottom: 20px;
      padding: 17px;
      background: #111;
      color: white;
      border-radius: 16px;
      text-align: center;
      font-weight: 700;
      cursor: pointer;
      z-index: 100;
    }

    .cart-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      gap: 10px;
    }

    .cart-row:last-child {
      margin-bottom: 0;
    }

    .quantity {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .quantity button {
      padding: 7px 11px;
      min-width: 38px;
    }

    .total {
      font-size: 21px;
      font-weight: 800;
      margin-top: 20px;
      margin-bottom: 15px;
    }

    .checkout-title {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 15px;
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      font-weight: 600;
      margin-bottom: 7px;
    }

    .field input,
    .field textarea {
      width: 100%;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 13px;
      font-size: 16px;
      font-family: Arial, sans-serif;
      outline: none;
      background: #fafafa;
    }

    .field input:focus,
    .field textarea:focus {
      border-color: #111;
    }

    .field textarea {
      min-height: 90px;
      resize: vertical;
    }

    .checkout-total {
      font-size: 20px;
      font-weight: 800;
      margin: 18px 0;
    }

    .primary-button {
      width: 100%;
      padding: 16px;
      font-size: 16px;
    }

    .success {
      text-align: center;
      background: white;
      border-radius: 18px;
      padding: 30px 20px;
    }

    .success-icon {
      font-size: 50px;
      margin-bottom: 10px;
    }

    .success-title {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .success-text {
      color: #777;
      line-height: 1.5;
      margin-bottom: 20px;
    }
  </style>
</head>

<body>

  <!-- ГЛАВНАЯ -->
  <div id="mainPage">

    <div class="header">
      <div class="logo">QRON</div>
      <div class="subtitle">Заказывай быстро</div>
    </div>

    <div class="category" onclick="openCategory('shawarma')">
      🌯 Шаурма
    </div>

    <div class="category" onclick="openCategory('food')">
      🍴 Основное меню
    </div>

    <div class="category" onclick="openCategory('salads')">
      🥗 Салаты
    </div>

    <div class="category" onclick="openCategory('extras')">
      ➕ Добавки
    </div>

  </div>


  <!-- ТОВАРЫ -->
  <div id="categoryPage" class="hidden">

    <div class="back" onclick="goBack()">
      ← Назад
    </div>

    <div class="header">
      <div class="logo" id="categoryTitle"></div>
      <div class="subtitle">Выбери блюдо</div>
    </div>

    <div id="products"></div>

  </div>


  <!-- КОРЗИНА -->
  <div id="cartPage" class="hidden">

    <div class="back" onclick="goBack()">
      ← Назад
    </div>

    <div class="header">
      <div class="logo">🛒 Корзина</div>
      <div class="subtitle">Проверь свой заказ</div>
    </div>

    <div class="cart" id="cartItems"></div>

    <div class="total" id="total"></div>

    <button
      class="primary-button"
      onclick="openCheckout()">
      Оформить заказ
    </button>

  </div>


  <!-- CHECKOUT -->
  <div id="checkoutPage" class="hidden">

    <div class="back" onclick="openCart()">
      ← Назад
    </div>

    <div class="header">
      <div class="logo">Оформление</div>
      <div class="subtitle">Заполни данные для заказа</div>
    </div>

    <div class="checkout-box">

      <div class="checkout-title">
        Ваш заказ
      </div>

      <div id="checkoutItems"></div>

      <div class="checkout-total" id="checkoutTotal"></div>

    </div>


    <div class="checkout-box">

      <div class="checkout-title">
        Данные
      </div>

      <div class="field">
        <label for="name">
          Имя
        </label>

        <input
          id="name"
          type="text"
          placeholder="Как к вам обращаться?">
      </div>


      <div class="field">
        <label for="phone">
          Телефон
        </label>

        <input
          id="phone"
          type="tel"
          placeholder="+7 700 000 00 00">
      </div>


      <div class="field">
        <label for="comment">
          Комментарий
        </label>

        <textarea
          id="comment"
          placeholder="Например: без лука, соус отдельно..."></textarea>
      </div>

    </div>


    <button
      id="sendOrderButton"
      class="primary-button"
      onclick="sendOrder()">
      🚀 Отправить заказ
    </button>

  </div>


  <!-- УСПЕШНЫЙ ЗАКАЗ -->
  <div id="successPage" class="hidden">

    <div class="success">

      <div class="success-icon">
        ✅
      </div>

      <div class="success-title">
        Заказ отправлен!
      </div>

      <div class="success-text">
        Спасибо за заказ.<br>
        Мы получили информацию и скоро свяжемся с вами.
      </div>

      <button
        class="primary-button"
        onclick="restart()">
        Вернуться в меню
      </button>

    </div>

  </div>


  <!-- КНОПКА КОРЗИНЫ -->
  <div
    id="cartButton"
    class="cart-button hidden"
    onclick="openCart()">
    🛒 Корзина
  </div>


  <script>

    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();


    /* =========================
       МЕНЮ
    ========================= */

    const menu = {

      shawarma: {
        title: "🌯 Шаурма",
        items: [
          ["MAX", 320],
          ["Стандарт", 250],
          ["Мини", 220],
          ["Гранатовая", 290],
          ["С креветкой", 360],
          ["Мексикано", 260],
          ["На тарелке", 300],
          ["В сырном лаваше MAX", 320],
          ["В сырном лаваше", 260],
          ["Фирменная", 390]
        ]
      },

      food: {
        title: "🍴 Основное меню",
        items: [
          ["Ролл куриный", 240],
          ["Мясо в лаваше", 260],
          ["Мясо в булке", 260],
          ["Хот-дог", 200],
          ["Хот-дог в лаваше", 180],
          ["Хот-дог двойной", 220],
          ["Донар", 280],
          ["Гирос", 280],
          ["Фахитос", 280],
          ["Секпасти", 350],
          ["Плов", 350],
          ["Картошка фри", 140],
          ["Наггетсы", 160]
        ]
      },

      salads: {
        title: "🥗 Салаты",
        items: [
          ["Салат весенний", 100],
          ["Салат летний", 150]
        ]
      },

      extras: {
        title: "➕ Добавки",
        items: [
          ["Фри", 30],
          ["Мясо", 50],
          ["Грибы", 30],
          ["Халапеньо", 30],
          ["Сыр", 30]
        ]
      }

    };


    /* =========================
       КОРЗИНА
    ========================= */

    let cart = [];


    /* =========================
       ПОКАЗ СТРАНИЦ
    ========================= */

    function hideAllPages() {

      document.getElementById("mainPage")
        .classList.add("hidden");

      document.getElementById("categoryPage")
        .classList.add("hidden");

      document.getElementById("cartPage")
        .classList.add("hidden");

      document.getElementById("checkoutPage")
        .classList.add("hidden");

      document.getElementById("successPage")
        .classList.add("hidden");

    }


    /* =========================
       КАТЕГОРИЯ
    ========================= */

    function openCategory(category) {

      hideAllPages();

      document.getElementById("categoryPage")
        .classList.remove("hidden");

      const data = menu[category];

      document.getElementById("categoryTitle")
        .textContent = data.title;

      const products =
        document.getElementById("products");

      products.innerHTML = "";

      data.items.forEach(item => {

        const name = item[0];
        const price = item[1];

        const product = document.createElement("div");

        product.className = "product";

        product.innerHTML = `
          <div>
            <div class="product-name">
              ${name}
            </div>

            <div class="price">
              ${price} ₸
            </div>
          </div>

          <button type="button">
            +
          </button>
        `;

        product.querySelector("button")
          .addEventListener("click", () => {
            addToCart(name, price);
          });

        products.appendChild(product);

      });

    }


    /* =========================
       ДОБАВЛЕНИЕ В КОРЗИНУ
    ========================= */

    function addToCart(name, price) {

      const existing = cart.find(
        item => item.name === name
      );

      if (existing) {

        existing.quantity++;

      } else {

        cart.push({
          name: name,
          price: price,
          quantity: 1
        });

      }

      updateCartButton();

      if (
        tg.HapticFeedback &&
        tg.HapticFeedback.impactOccurred
      ) {
        tg.HapticFeedback.impactOccurred("light");
      }

    }


    /* =========================
       КНОПКА КОРЗИНЫ
    ========================= */

    function updateCartButton() {

      const button =
        document.getElementById("cartButton");

      if (cart.length === 0) {

        button.classList.add("hidden");

        return;

      }

      const count = cart.reduce(
        (sum, item) =>
          sum + item.quantity,
        0
      );

      button.textContent =
        `🛒 Корзина · ${count}`;

      button.classList.remove("hidden");

    }


    /* =========================
       КОРЗИНА
    ========================= */

    function openCart() {

      hideAllPages();

      document.getElementById("cartPage")
        .classList.remove("hidden");

      renderCart();

    }


    function renderCart() {

      const container =
        document.getElementById("cartItems");

      if (cart.length === 0) {

        container.innerHTML =
          "Корзина пока пустая.";

        document.getElementById("total")
          .textContent = "";

        return;

      }

      container.innerHTML = "";

      let total = 0;

      cart.forEach((item, index) => {

        const sum =
          item.price * item.quantity;

        total += sum;

        const row =
          document.createElement("div");

        row.className = "cart-row";

        row.innerHTML = `
          <div>
            <strong>${item.name}</strong>
            <br>
            ${sum} ₸
          </div>

          <div class="quantity">

            <button type="button">
              −
            </button>

            <span>
              ${item.quantity}
            </span>

            <button type="button">
              +
            </button>

          </div>
        `;

        const buttons =
          row.querySelectorAll("button");

        buttons[0].addEventListener(
          "click",
          () => changeQuantity(index, -1)
        );

        buttons[1].addEventListener(
          "click",
          () => changeQuantity(index, 1)
        );

        container.appendChild(row);

      });

      document.getElementById("total")
        .textContent =
        `Итого: ${total} ₸`;

    }


    function changeQuantity(index, change) {

      cart[index].quantity += change;

      if (cart[index].quantity <= 0) {

        cart.splice(index, 1);

      }

      updateCartButton();

      renderCart();

    }


    /* =========================
       CHECKOUT
    ========================= */

    function openCheckout() {

      if (cart.length === 0) {

        alert("Корзина пустая");

        return;

      }

      hideAllPages();

      document.getElementById("checkoutPage")
        .classList.remove("hidden");

      renderCheckout();

    }


    function renderCheckout() {

      const container =
        document.getElementById("checkoutItems");

      container.innerHTML = "";

      let total = 0;

      cart.forEach(item => {

        const sum =
          item.price * item.quantity;

        total += sum;

        container.innerHTML += `
          <div style="
            display:flex;
            justify-content:space-between;
            margin-bottom:10px;
          ">
            <span>
              ${item.name} × ${item.quantity}
            </span>

            <strong>
              ${sum} ₸
            </strong>
          </div>
        `;

      });

      document.getElementById("checkoutTotal")
        .textContent =
        `Итого: ${total} ₸`;

    }


    /* =========================
       ОТПРАВКА ЗАКАЗА
    ========================= */

    async function sendOrder() {

      if (cart.length === 0) {

        alert("Корзина пустая");

        return;

      }


      const name =
        document.getElementById("name")
          .value
          .trim();

      const phone =
        document.getElementById("phone")
          .value
          .trim();

      const comment =
        document.getElementById("comment")
          .value
          .trim();


      if (!name) {

        alert("Введите имя");

        return;

      }


      if (!phone) {

        alert("Введите номер телефона");

        return;

      }


      const user =
        tg.initDataUnsafe &&
        tg.initDataUnsafe.user;


      if (!user || !user.id) {

        alert(
          "Откройте QRON через Telegram-бота"
        );

        return;

      }


      const total = cart.reduce(
        (sum, item) =>
          sum + item.price * item.quantity,
        0
      );


      const order = cart.map(item => ({

        name: item.name,

        price: item.price,

        quantity: item.quantity

      }));


      const button =
        document.getElementById(
          "sendOrderButton"
        );

      button.disabled = true;

      button.textContent =
        "⏳ Отправляем...";


      try {

        const response =
          await fetch("/api/order", {

            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({

              order: order,

              total: total,

              user: {

                id: user.id,

                first_name:
                  user.first_name || "",

                username:
                  user.username || ""

              },

              customer: {

                name: name,

                phone: phone,

                comment: comment

              }

            })

          });


        const result =
          await response.json();


        if (!response.ok || !result.success) {

          throw new Error(
            result.error ||
            "Не удалось отправить заказ"
          );

        }


        hideAllPages();

        document.getElementById("successPage")
          .classList.remove("hidden");

        document.getElementById("cartButton")
          .classList.add("hidden");

        cart = [];


        if (
          tg.HapticFeedback &&
          tg.HapticFeedback.notificationOccurred
        ) {

          tg.HapticFeedback
            .notificationOccurred("success");

        }


      } catch (error) {

        alert(
          "❌ Не удалось отправить заказ.\n\n" +
          "Попробуйте ещё раз."
        );

        button.disabled = false;

        button.textContent =
          "🚀 Отправить заказ";

      }

    }


    /* =========================
       НАЗАД
    ========================= */

    function goBack() {

      hideAllPages();

      document.getElementById("mainPage")
        .classList.remove("hidden");

    }


    /* =========================
       НАЧАТЬ ЗАНОВО
    ========================= */

    function restart() {

      cart = [];

      updateCartButton();

      document.getElementById("name")
        .value = "";

      document.getElementById("phone")
        .value = "";

      document.getElementById("comment")
        .value = "";

      const button =
        document.getElementById(
          "sendOrderButton"
        );

      button.disabled = false;

      button.textContent =
        "🚀 Отправить заказ";

      hideAllPages();

      document.getElementById("mainPage")
        .classList.remove("hidden");

    }

  </script>

</body>
</html>
