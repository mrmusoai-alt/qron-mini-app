<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Шаурма Мастер</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#050505;--card:#111214;--line:#292929;--muted:#888;--yellow:#ffd400}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--bg);color:#fff;font-family:Arial,sans-serif;padding-bottom:82px}.page{max-width:430px;margin:auto;padding:12px 14px 100px}.hidden{display:none!important}.top{position:sticky;top:0;z-index:20;background:#050505;padding:9px 0 11px;display:flex;justify-content:space-between;align-items:center}.logo{color:var(--yellow);font-size:27px;font-weight:900;font-style:italic}.tg{color:#777;font-size:11px;margin-top:3px}.cart-top{width:43px;height:43px;border:1px solid var(--line);background:#111;border-radius:14px;color:#fff;font-size:20px;position:relative}.badge{position:absolute;right:-5px;top:-6px;background:var(--yellow);color:#111;border:2px solid #050505;border-radius:99px;min-width:21px;height:21px;font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center}.hero{height:155px;border:1px solid var(--line);border-radius:22px;overflow:hidden;background:linear-gradient(90deg,rgba(0,0,0,.75),rgba(0,0,0,.15)),url('https://images.unsplash.com/photo-1561651823-34feb02250e4?auto=format&fit=crop&w=900&q=85') center/cover;display:flex;align-items:flex-end;padding:17px;margin-bottom:13px}.hero b{font-size:25px;color:var(--yellow);line-height:1.02}.search{height:48px;width:100%;background:#151515;border:1px solid #303030;border-radius:15px;color:#fff;padding:0 15px;font-size:15px;outline:0;margin-bottom:12px}.cats{display:flex;gap:8px;overflow:auto;padding-bottom:2px;margin-bottom:18px;scrollbar-width:none}.cats::-webkit-scrollbar{display:none}.cat{flex:0 0 76px;height:62px;background:#101010;border:1px solid #282828;color:#ddd;border-radius:15px;font-size:11px;font-weight:800}.cat.active{background:var(--yellow);color:#111;border-color:var(--yellow)}h2{font-size:21px;margin:0 0 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;overflow:hidden}.photo{height:125px;background:#171717}.photo img{width:100%;height:100%;object-fit:cover;display:block}.body{padding:10px}.name{font-size:14px;font-weight:800;min-height:34px;line-height:1.2}.row{display:flex;justify-content:space-between;align-items:center;gap:7px;margin-top:8px}.price{font-size:16px;font-weight:900}.plus{width:32px;height:32px;border:0;border-radius:50%;background:var(--yellow);color:#111;font-size:22px;font-weight:900}.back{border:0;background:transparent;color:#fff;padding:5px 0;margin-bottom:12px;font-size:15px}.title{font-size:24px;font-weight:900;margin-bottom:5px}.sub{color:#777;font-size:13px;margin-bottom:16px}.detail{background:#0d0d0d;border:1px solid var(--line);border-radius:21px;overflow:hidden}.detail img{width:100%;height:250px;object-fit:cover;display:block}.detail-body{padding:17px}.detail-name{font-size:25px;font-weight:900}.detail-price{color:var(--yellow);font-size:22px;font-weight:900;margin-top:6px}.detail-text{color:#aaa;font-size:14px;line-height:1.4;margin-top:9px}.qty{display:flex;align-items:center;gap:8px;background:#1b1b1b;padding:5px;border-radius:14px}.qty button{width:38px;height:38px;border:0;border-radius:11px;background:#292929;color:#fff;font-size:21px}.add{flex:1;height:48px;border:0;border-radius:14px;background:var(--yellow);color:#111;font-weight:900}.actions{display:flex;gap:9px;margin-top:18px}.box{background:#101010;border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:12px}.cart-row{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid #292929}.cart-row:last-child{border:0}.cart-name{font-weight:800}.cart-sum{color:var(--yellow);font-weight:900;margin-top:4px}.main{width:100%;height:49px;border:0;border-radius:15px;background:var(--yellow);color:#111;font-weight:900;font-size:15px;margin-top:12px}.field{margin-bottom:13px}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:6px}.field input,.field textarea{width:100%;background:#151515;color:#fff;border:1px solid #303030;border-radius:13px;padding:13px;font-size:16px;outline:0}.field textarea{min-height:90px;resize:vertical}.empty{text-align:center;color:#777;padding:30px 10px}.hist{background:#101010;border:1px solid var(--line);border-radius:17px;padding:15px;margin-bottom:10px}.hist-top{display:flex;justify-content:space-between;font-weight:900}.status{color:#4be98a;font-size:12px}.hist-date{color:#777;font-size:12px;margin:6px 0 10px}.hist-item{display:flex;justify-content:space-between;font-size:13px;padding:3px 0}.nav{position:fixed;left:0;right:0;bottom:0;height:70px;background:#050505;border-top:1px solid #252525;z-index:50}.navin{max-width:430px;margin:auto;height:100%;display:grid;grid-template-columns:repeat(3,1fr)}.nav button{background:transparent;border:0;color:#777;font-size:10px;font-weight:800}.nav button.active{color:var(--yellow)}.nav i{display:block;font-style:normal;font-size:21px;margin-bottom:2px}@media(min-width:391px){.photo{height:145px}.photo img{height:145px}}
</style>
</head>
<body>
<div id="home" class="page">
 <div class="top"><div><div class="logo">🍴 Шаурма Мастер</div><div class="tg">Вкусно • быстро • прямо в Telegram</div></div><button class="cart-top" onclick="openCart()">🛒<span id="badge" class="badge hidden">0</span></button></div>
 <div class="hero"><b>Настоящая<br>шаурма<br>с сочной начинкой</b></div>
 <input id="search" class="search" placeholder="Что хотите заказать?" autocomplete="off">
 <div class="cats"><button class="cat active" data-c="all">Все</button><button class="cat" data-c="shawarma">🌯<br>Шаурма</button><button class="cat" data-c="food">🍴<br>Основное</button><button class="cat" data-c="salads">🥗<br>Салаты</button><button class="cat" data-c="extras">➕<br>Добавки</button></div>
 <h2 id="heading">Популярное</h2><div id="homeGrid" class="grid"></div>
</div>
<div id="category" class="page hidden"><button class="back" onclick="home()">← Назад</button><div id="catTitle" class="title"></div><div class="sub">Шаурма Мастер • выбери своё блюдо</div><div id="catGrid" class="grid"></div></div>
<div id="detail" class="page hidden"><button class="back" onclick="home()">← Назад</button><div class="detail"><img id="dImg"><div class="detail-body"><div id="dName" class="detail-name"></div><div id="dPrice" class="detail-price"></div><div id="dText" class="detail-text"></div><div class="actions"><div class="qty"><button onclick="dQty(-1)">−</button><b id="dQty">1</b><button onclick="dQty(1)">+</button></div><button class="add" onclick="addDetail()">Добавить в корзину</button></div></div></div></div>
<div id="cart" class="page hidden"><button class="back" onclick="home()">← Меню</button><div class="title">Корзина</div><div class="sub">Проверь заказ перед оформлением</div><div id="cartBox" class="box"></div><button class="main" onclick="checkout()">Оформить заказ</button></div>
<div id="checkout" class="page hidden"><button class="back" onclick="openCart()">← Корзина</button><div class="title">Оформление</div><div class="sub">Осталось заполнить данные</div><div id="checkBox" class="box"></div><div class="box"><div class="field"><label>Имя</label><input id="name" placeholder="Ваше имя"></div><div class="field"><label>Телефон</label><input id="phone" type="tel" placeholder="+7 700 000 00 00"></div><div class="field"><label>Комментарий</label><textarea id="comment" placeholder="Например: без лука..."></textarea></div></div><button id="send" class="main" onclick="sendOrder()">🚀 Отправить заказ</button></div>
<div id="history" class="page hidden"><button class="back" onclick="home()">← Меню</button><div class="title">Мои заказы</div><div class="sub">История ваших заказов</div><div id="historyBox"></div></div>
<div id="profile" class="page hidden"><button class="back" onclick="home()">← Меню</button><div class="title">Профиль</div><div class="sub">Ваш Telegram-профиль</div><div class="box" style="text-align:center"><div id="pName" style="font-size:20px;font-weight:900">Пользователь Telegram</div><div id="pUser" style="color:#777;margin-top:5px"></div></div></div>
<div class="nav"><div class="navin"><button id="nHome" class="active" onclick="home()"><i>⌂</i>Главная</button><button id="nHist" onclick="historyPage()"><i>▣</i>Мои заказы</button><button id="nProf" onclick="profilePage()"><i>♙</i>Профиль</button></div></div>
<script>
const tg=window.Telegram&&window.Telegram.WebApp;if(tg){tg.ready();tg.expand()};
const user=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user;
if(user){document.getElementById('pName').textContent=[user.first_name,user.last_name].filter(Boolean).join(' ')||'Пользователь Telegram';document.getElementById('pUser').textContent=user.username?'@'+user.username:'Telegram'}
const imgs={shawarma:'https://images.unsplash.com/photo-1561651823-34feb02250e4?auto=format&fit=crop&w=900&q=80',food:'https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=900&q=80',hotdog:'https://images.unsplash.com/photo-1612392062631-94dd858cba88?auto=format&fit=crop&w=900&q=80',fries:'https://images.unsplash.com/photo-1573080496219-bb080dd4f877?auto=format&fit=crop&w=900&q=80',salad:'https://images.unsplash.com/photo-1512621776951-a57141f2eefd?auto=format&fit=crop&w=900&q=80'};
const menu={shawarma:{title:'🌯 Шаурма',img:imgs.shawarma,items:[['MAX',320],['Стандарт',250],['Мини',220],['Гранатовая',290],['С креветкой',360],['Мексикано',260],['На тарелке',300],['В сырном лаваше MAX',320],['В сырном лаваше',260],['Фирменная',390]]},food:{title:'🍴 Основное',img:imgs.food,items:[['Ролл куриный',240],['Мясо в лаваше',260],['Мясо в булке',260],['Хот-дог',200],['Хот-дог в лаваше',180],['Хот-дог двойной',220],['Донар',280],['Гирос',280],['Фахитос',280],['Секпасти',350],['Плов',350],['Картошка фри',140],['Наггетсы',160]]},salads:{title:'🥗 Салаты',img:imgs.salad,items:[['Салат весенний',100],['Салат летний',150]]},extras:{title:'➕ Добавки',img:imgs.fries,items:[['Фри',30],['Мясо',50],['Грибы',30],['Халапеньо',30],['Сыр',30]]}};
let cart=[];let detail=null,detailQ=1;const popular=[['shawarma','MAX'],['shawarma','Стандарт'],['food','Донар'],['food','Гирос'],['food','Картошка фри'],['food','Наггетсы']];
function image(c,n){if(n.includes('Хот-дог'))return imgs.hotdog;if(n.includes('Фри')||n.includes('Наггет'))return imgs.fries;return menu[c].img}
function label(n){return n==='MAX'?'Шаурма MAX':n==='Стандарт'?'Шаурма Стандарт':n}
function all(){return Object.entries(menu).flatMap(([c,v])=>v.items.map(x=>({c,n:x[0],p:x[1]})))}
function cards(list,el){el.innerHTML='';if(!list.length){el.innerHTML='<div class="empty" style="grid-column:1/-1">🔎<br><br>Ничего не найдено</div>';return}list.forEach(x=>{const d=document.createElement('div');d.className='card';d.innerHTML=`<div class="photo"><img src="${image(x.c,x.n)}" loading="lazy"></div><div class="body"><div class="name">${label(x.n)}</div><div class="row"><span class="price">${x.p} ₸</span><button class="plus">+</button></div></div>`;d.onclick=()=>openDetail(x.c,x.n,x.p);d.querySelector('.plus').onclick=e=>{e.stopPropagation();add(x.n,x.p)};el.appendChild(d)})}
function renderHome(){const q=document.getElementById('search').value.toLowerCase().trim();const active=document.querySelector('.cat.active').dataset.c;let list=active==='all'?popular.map(([c,n])=>{const x=menu[c].items.find(i=>i[0]===n);return{c,n,p:x[1]}}):menu[active].items.map(x=>({c:active,n:x[0],p:x[1]}));if(q)list=all().filter(x=>label(x.n).toLowerCase().includes(q));document.getElementById('heading').textContent=q?'🔎 Результаты':active==='all'?'Популярное':menu[active].title.replace(/🌯|🍴|🥗|➕/g,'').trim();cards(list,document.getElementById('homeGrid'))}
document.getElementById('search').oninput=renderHome;document.querySelectorAll('.cat').forEach(b=>b.onclick=()=>{document.querySelectorAll('.cat').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderHome()});
function hide(){document.querySelectorAll('.page').forEach(x=>x.classList.add('hidden'))}function nav(id){document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active')}
function home(){hide();document.getElementById('home').classList.remove('hidden');nav('nHome');scrollTo(0,0);renderHome()}
function openDetail(c,n,p){detail={c,n,p};detailQ=1;hide();document.getElementById('detail').classList.remove('hidden');document.getElementById('dImg').src=image(c,n);document.getElementById('dName').textContent=label(n);document.getElementById('dPrice').textContent=p+' ₸';document.getElementById('dText').textContent='Вкусное блюдо от Шаурма Мастер. Свежая начинка и фирменный соус.';document.getElementById('dQty').textContent=1;scrollTo(0,0)}
function dQty(v){detailQ=Math.max(1,detailQ+v);document.getElementById('dQty').textContent=detailQ}
function addDetail(){for(let i=0;i<detailQ;i++)add(detail.n,detail.p);home()}
function add(n,p){const x=cart.find(i=>i.n===n);x?x.q++:cart.push({n,p,q:1});updateCart();if(tg?.HapticFeedback?.impactOccurred)tg.HapticFeedback.impactOccurred('light')}
function updateCart(){const q=cart.reduce((s,x)=>s+x.q,0);document.getElementById('badge').textContent=q;document.getElementById('badge').classList.toggle('hidden',!q)}
function openCart(){hide();document.getElementById('cart').classList.remove('hidden');nav('nHome');renderCart();scrollTo(0,0)}
function renderCart(){const b=document.getElementById('cartBox');if(!cart.length){b.innerHTML='<div class="empty">🛒<br><br>Корзина пустая<br><small>Добавь что-нибудь вкусное</small></div>';return}b.innerHTML=cart.map((x,i)=>`<div class="cart-row"><div><div class="cart-name">${label(x.n)} × ${x.q}</div><div class="cart-sum">${x.p*x.q} ₸</div></div><div class="qty"><button onclick="changeQ(${i},-1)">−</button><b>${x.q}</b><button onclick="changeQ(${i},1)">+</button></div></div>`).join('')+`<div style="display:flex;justify-content:space-between;font-size:19px;font-weight:900;padding-top:15px"><span>Итого</span><span>${total()} ₸</span></div>`}
function changeQ(i,v){cart[i].q+=v;if(cart[i].q<=0)cart.splice(i,1);updateCart();renderCart()};function total(){return cart.reduce((s,x)=>s+x.p*x.q,0)}
function checkout(){if(!cart.length)return alert('Корзина пустая');hide();document.getElementById('checkout').classList.remove('hidden');nav('nHome');document.getElementById('checkBox').innerHTML=cart.map(x=>`<div style="display:flex;justify-content:space-between;padding:5px 0;font-size:14px"><span>${label(x.n)} × ${x.q}</span><b>${x.p*x.q} ₸</b></div>`).join('')+`<div style="display:flex;justify-content:space-between;border-top:1px solid #292929;margin-top:8px;padding-top:12px;font-weight:900;font-size:18px"><span>Итого</span><span>${total()} ₸</span></div>`;scrollTo(0,0)}
async function sendOrder(){if(!user?.id)return alert('Откройте приложение через Telegram-бота');const name=document.getElementById('name').value.trim(),phone=document.getElementById('phone').value.trim(),comment=document.getElementById('comment').value.trim();if(!name)return alert('Введите имя');if(!phone)return alert('Введите номер телефона');const btn=document.getElementById('send');btn.disabled=true;btn.textContent='⏳ Отправляем...';try{const r=await fetch('/api/order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({order:cart.map(x=>({name:x.n,price:x.p,quantity:x.q})),total:total(),user:{id:user.id,first_name:user.first_name||'',username:user.username||''},customer:{name,phone,comment}})});const data=await r.json();if(!r.ok||!data.success)throw Error(data.error||'Ошибка');cart=[];updateCart();hide();document.getElementById('home').classList.remove('hidden');nav('nHome');alert('✅ Заказ принят!')}catch(e){alert('❌ Не удалось отправить заказ. Попробуйте ещё раз.')}finally{btn.disabled=false;btn.textContent='🚀 Отправить заказ'}}
async function historyPage(){hide();document.getElementById('history').classList.remove('hidden');nav('nHist');const b=document.getElementById('historyBox');if(!user?.id){b.innerHTML='<div class="box empty">Откройте приложение через Telegram</div>';return}b.innerHTML='<div class="empty">⏳ Загружаем...</div>';try{const r=await fetch('/api/history?telegram_id='+encodeURIComponent(user.id));const d=await r.json();if(!r.ok||!d.success)throw Error();if(!d.orders.length){b.innerHTML='<div class="box empty">🛒<br><br>Заказов пока нет</div>';return}b.innerHTML=d.orders.map(o=>{let items=[];try{items=Array.isArray(o.items)?o.items:JSON.parse(o.items||'[]')}catch(e){}return `<div class="hist"><div class="hist-top"><span>Заказ #${o.id}</span><span class="status">${o.status||'Принят'}</span></div><div class="hist-date">${o.created_at?new Date(o.created_at).toLocaleString('ru-RU'):''}</div>${items.map(x=>`<div class="hist-item"><span>${label(x.name)} × ${x.quantity}</span><b>${x.price*x.quantity} ₸</b></div>`).join('')}<div style="display:flex;justify-content:space-between;margin-top:10px;font-weight:900"><span>Итого</span><span>${o.total} ₸</span></div></div>`}).join('')}catch(e){b.innerHTML='<div class="box empty">⚠️ Не удалось загрузить историю</div>'}scrollTo(0,0)}
function profilePage(){hide();document.getElementById('profile').classList.remove('hidden');nav('nProf');scrollTo(0,0)}
renderHome();updateCart();
</script>
</body>
</html>
